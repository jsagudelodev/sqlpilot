[project]
name = "sqlpilot"
version = "0.1.0"
description = "Copiloto de diagnóstico y operación para DBAs de SQL Server"
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
sqlpilot = "sqlpilot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sqlpilot*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "PYI034", "E731"]
